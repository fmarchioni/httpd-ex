<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asteroids by OpenShift</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace; /* Font "retro" */
        }
        #gameCanvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    // --- COSTANTI DI GIOCO ---
    const FPS = 60; // Frames per secondo
    const FRICTION = 0.99; // Attrito nello spazio (0 = no attrito, 1 = tanto attrito)
    const GAME_LIVES = 3; // Vite iniziali
    const LASER_DIST = 0.6; // Distanza massima laser (frazione larghezza schermo)
    const LASER_MAX = 10; // Numero massimo di laser sullo schermo
    const LASER_SPD = 500; // Velocità laser in pixel al secondo
    const ROID_JAG = 0.4; // Irregolarità asteroidi (0 = nessuno, 1 = molta)
    const ROID_NUM = 3; // Numero iniziale di asteroidi (livello 1)
    const ROID_SIZE = 100; // Dimensione iniziale asteroidi in pixel
    const ROID_SPD = 50; // Velocità massima iniziale asteroidi in pixel al secondo
    const ROID_VERT = 10; // Numero medio di vertici su ogni asteroide
    const SHIP_BLINK_DUR = 0.1; // Durata del lampeggio durante l'invulnerabilità
    const SHIP_EXPLODE_DUR = 0.3; // Durata esplosione nave
    const SHIP_INV_DUR = 3; // Durata invulnerabilità iniziale
    const SHIP_SIZE = 30; // Altezza nave in pixel
    const SHIP_THRUST = 5; // Accelerazione nave (pixel al secondo quadro)
    const SHIP_TURN_SPD = 360; // Velocità di rotazione in gradi al secondo
    const SHOW_BOUNDING = false; // Mostra collisioni (debug)
    const TEXT_FADE_TIME = 2.5; // Tempo di dissolvenza testo in secondi
    const TEXT_SIZE = 40; // Altezza font testo in pixel

    // --- SETUP CANVAS ---
    /** @type {HTMLCanvasElement} */
    const canv = document.getElementById("gameCanvas");
    const ctx = canv.getContext("2d");
    let w, h;

    function resize() {
        w = canv.width = window.innerWidth;
        h = canv.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- CARICAMENTO ASSET ---
    const logoImg = new Image();
    logoImg.src = 'openshift.png';
    let logoLoaded = false;
    logoImg.onload = () => { logoLoaded = true; };


    // --- STATO DEL GIOCO ---
    let level, lives, roids, score, scoreHigh, ship, text, textAlpha;
    let gameState = "INTRO"; // INTRO, PLAY, GAMEOVER

    // Setup parametri nave
    const newShip = () => {
        return {
            x: w / 2,
            y: h / 2,
            a: 90 / 180 * Math.PI, // Converti in radianti (punta in alto)
            r: SHIP_SIZE / 2,
            blinkNum: Math.ceil(SHIP_INV_DUR / SHIP_BLINK_DUR),
            blinkTime: Math.ceil(SHIP_BLINK_DUR * FPS),
            canShoot: true,
            dead: false,
            explodeTime: 0,
            lasers: [],
            rot: 0,
            thrusting: false,
            thrust: { x: 0, y: 0 }
        }
    }

    // Setup parametri asteroidi
    const newAsteroid = (x, y, r) => {
        const lvlMult = 1 + 0.1 * level;
        const roid = {
            x: x,
            y: y,
            xv: Math.random() * ROID_SPD * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
            yv: Math.random() * ROID_SPD * lvlMult / FPS * (Math.random() < 0.5 ? 1 : -1),
            r: r,
            a: Math.random() * Math.PI * 2, // Angolo
            vert: Math.floor(Math.random() * (ROID_VERT + 1) + ROID_VERT / 2),
            offs: []
        };
        // Crea la forma irregolare
        for (let i = 0; i < roid.vert; i++) {
            roid.offs.push(Math.random() * ROID_JAG * 2 + 1 - ROID_JAG);
        }
        return roid;
    }

    const createAsteroidBelt = () => {
        roids = [];
        let x, y;
        for (let i = 0; i < ROID_NUM + level; i++) {
            // Posizione casuale asteroide (lontano dalla nave all'inizio)
            do {
                x = Math.floor(Math.random() * w);
                y = Math.floor(Math.random() * h);
            } while (distBetweenPoints(ship.x, ship.y, x, y) < ROID_SIZE * 2 + ship.r);
            roids.push(newAsteroid(x, y, Math.ceil(ROID_SIZE / 2)));
        }
    }

    const destroyAsteroid = (index) => {
        const x = roids[index].x;
        const y = roids[index].y;
        const r = roids[index].r;

        // Dividi l'asteroide in due se necessario
        if (r == Math.ceil(ROID_SIZE / 2)) { // Asteroide grande
            roids.push(newAsteroid(x, y, Math.ceil(ROID_SIZE / 4)));
            roids.push(newAsteroid(x, y, Math.ceil(ROID_SIZE / 4)));
            score += 20;
        } else if (r == Math.ceil(ROID_SIZE / 4)) { // Asteroide medio
            roids.push(newAsteroid(x, y, Math.ceil(ROID_SIZE / 8)));
            roids.push(newAsteroid(x, y, Math.ceil(ROID_SIZE / 8)));
            score += 50;
        } else {
            score += 100; // Asteroide piccolo
        }

        // Rimuovi l'asteroide originale
        roids.splice(index, 1);

        // Nuovo livello se non ci sono più asteroidi
        if (roids.length === 0) {
            level++;
            newLevel();
        }
    }

    const distBetweenPoints = (x1, y1, x2, y2) => {
        return Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    }

    const explodeShip = () => {
        ship.explodeTime = Math.ceil(SHIP_EXPLODE_DUR * FPS);
    }

    const gameOver = () => {
        ship.dead = true;
        text = "GAME OVER";
        textAlpha = 1.0;
    }

    const newGame = () => {
        level = 0;
        lives = GAME_LIVES;
        score = 0;
        ship = newShip();
        // Ottieni high score dal local storage
        const scoreStr = localStorage.getItem("highscore");
        scoreHigh = (scoreStr == null) ? 0 : parseInt(scoreStr);
        newLevel();
        gameState = "PLAY";
    }

    const newLevel = () => {
        text = "LEVEL " + (level + 1);
        textAlpha = 1.0;
        createAsteroidBelt();
    }

    const shootLaser = () => {
        // Crea laser object
        if (ship.canShoot && ship.lasers.length < LASER_MAX) {
            ship.lasers.push({ // spara dalla punta della nave
                x: ship.x + 4 / 3 * ship.r * Math.cos(ship.a),
                y: ship.y - 4 / 3 * ship.r * Math.sin(ship.a),
                xv: LASER_SPD * Math.cos(ship.a) / FPS,
                yv: -LASER_SPD * Math.sin(ship.a) / FPS,
                dist: 0
            });
        }
        // Previeni fuoco rapido automatico
        ship.canShoot = false;
    }

    // --- CONTROLLI ---
    const onKeyDown = (ev) => {
        if (ship.dead || gameState === "INTRO") return;
        switch(ev.keyCode) {
            case 32: // Space bar (sparo)
                shootLaser();
                break;
            case 37: // Sinistra (ruota a sx)
                ship.rot = SHIP_TURN_SPD / 180 * Math.PI / FPS;
                break;
            case 38: // Su (accelera)
                ship.thrusting = true;
                break;
            case 39: // Destra (ruota a dx)
                ship.rot = -SHIP_TURN_SPD / 180 * Math.PI / FPS;
                break;
        }
    }

    const onKeyUp = (ev) => {
        if (gameState === "INTRO") {
            // Qualsiasi tasto per iniziare
            newGame();
            return;
        }
        if (ship.dead) return;

        switch(ev.keyCode) {
            case 32: // Space bar (permetti di sparare di nuovo)
                ship.canShoot = true;
                break;
            case 37: // Stop rotazione sx
                ship.rot = 0;
                break;
            case 38: // Stop accelerazione
                ship.thrusting = false;
                break;
            case 39: // Stop rotazione dx
                ship.rot = 0;
                break;
        }
    }
    document.addEventListener("keydown", onKeyDown);
    document.addEventListener("keyup", onKeyUp);
    // Supporto touch base per iniziare il gioco su mobile
    document.addEventListener("touchstart", () => {
         if (gameState === "INTRO") newGame();
    });


    // --- GAME LOOP ---
    function loop() {
        // Background spazio
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, w, h);

        if (gameState === "INTRO") {
            drawIntro();
        } else {
            updateGame();
            drawGame();
        }

        requestAnimationFrame(loop);
    }

    function drawIntro() {
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "white";

        // Titolo
        ctx.font = (TEXT_SIZE * 1.5) + "px 'Courier New', Courier, monospace";
        ctx.fillText("ASTEROIDS BY", w / 2, h / 2 - 150);

        // Logo
        if (logoLoaded) {
            const logoW = Math.min(w * 0.6, 400); // Max 60% schermo o 400px
            const ratio = logoImg.height / logoImg.width;
            const logoH = logoW * ratio;
            ctx.drawImage(logoImg, w / 2 - logoW / 2, h / 2 - 50, logoW, logoH);
        } else {
             ctx.fillText("LOADING LOGO...", w / 2, h / 2);
        }

        // "Premi start" lampeggiante
        if (Math.floor(Date.now() / 500) % 2 === 0) { // Lampeggia ogni 500ms
             ctx.font = (TEXT_SIZE * 0.7) + "px 'Courier New', Courier, monospace";
             ctx.fillText("PRESS ANY KEY TO START", w / 2, h / 2 + 150);
        }

        // Istruzioni veloci
        ctx.font = "16px 'Courier New', Courier, monospace";
        ctx.fillStyle = "#aaa";
        ctx.fillText("ARROWS to move/rotate | SPACE to shoot", w / 2, h - 50);
    }


    function updateGame() {
        const exploding = ship.explodeTime > 0;
        const blinkOn = ship.blinkNum % 2 == 0;

        // Ruota nave
        if (!exploding) ship.a += ship.rot;

        // Gestisci accelerazione
        if (ship.thrusting && !ship.dead) {
            ship.thrust.x += SHIP_THRUST * Math.cos(ship.a) / FPS;
            ship.thrust.y -= SHIP_THRUST * Math.sin(ship.a) / FPS;
        } else {
            // Applica attrito quando non si accelera
            ship.thrust.x -= FRICTION * ship.thrust.x / FPS;
            ship.thrust.y -= FRICTION * ship.thrust.y / FPS;
        }

        // Muovi nave
        if (!exploding) {
            ship.x += ship.thrust.x;
            ship.y += ship.thrust.y;

            // Gestisci bordi schermo (teletrasporto)
            if (ship.x < 0 - ship.r) ship.x = w + ship.r;
            else if (ship.x > w + ship.r) ship.x = 0 - ship.r;
            if (ship.y < 0 - ship.r) ship.y = h + ship.r;
            else if (ship.y > h + ship.r) ship.y = 0 - ship.r;
        }

        // Muovi laser
        for (let i = ship.lasers.length - 1; i >= 0; i--) {
            // Controlla distanza percorsa
            if (ship.lasers[i].dist > LASER_DIST * w) {
                ship.lasers.splice(i, 1);
                continue;
            }

            // Muovi laser
            ship.lasers[i].x += ship.lasers[i].xv;
            ship.lasers[i].y += ship.lasers[i].yv;

            // Calcola distanza percorsa
            ship.lasers[i].dist += Math.sqrt(Math.pow(ship.lasers[i].xv, 2) + Math.pow(ship.lasers[i].yv, 2));

            // Gestisci bordi schermo laser
            if (ship.lasers[i].x < 0) ship.lasers[i].x = w;
            else if (ship.lasers[i].x > w) ship.lasers[i].x = 0;
            if (ship.lasers[i].y < 0) ship.lasers[i].y = h;
            else if (ship.lasers[i].y > h) ship.lasers[i].y = 0;
        }

        // Muovi asteroidi
        for (let i = 0; i < roids.length; i++) {
            roids[i].x += roids[i].xv;
            roids[i].y += roids[i].yv;

            // Gestisci bordi schermo asteroidi
            if (roids[i].x < 0 - roids[i].r) roids[i].x = w + roids[i].r;
            else if (roids[i].x > w + roids[i].r) roids[i].x = 0 - roids[i].r;
            if (roids[i].y < 0 - roids[i].r) roids[i].y = h + roids[i].r;
            else if (roids[i].y > h + roids[i].r) roids[i].y = 0 - roids[i].r;
        }

        // --- COLLISIONI ---
        if (!exploding) {
            // Verifica collisione nave-asteroide (solo se non invulnerabile)
            if (ship.blinkNum == 0 && !ship.dead) {
                for (let i = 0; i < roids.length; i++) {
                    if (distBetweenPoints(ship.x, ship.y, roids[i].x, roids[i].y) < ship.r + roids[i].r) {
                        explodeShip();
                        destroyAsteroid(i);
                        break;
                    }
                }
            }

            // Ruota nave
            ship.a += ship.rot;

            // Verifica collisione laser-asteroide
            for (let i = roids.length - 1; i >= 0; i--) {
                for (let j = ship.lasers.length - 1; j >= 0; j--) {
                    if (distBetweenPoints(ship.lasers[j].x, ship.lasers[j].y, roids[i].x, roids[i].y) < roids[i].r) {
                        ship.lasers.splice(j, 1);
                        destroyAsteroid(i);
                        break;
                    }
                }
            }
        } else {
            // Riduci tempo esplosione
            ship.explodeTime--;
            if (ship.explodeTime == 0) {
                lives--;
                if (lives == 0) {
                    gameOver();
                } else {
                    ship = newShip();
                }
            }
        }

        // Gestisci invulnerabilità
        if (ship.blinkNum > 0) {
            ship.blinkTime--;
            if (ship.blinkTime == 0) {
                ship.blinkTime = Math.ceil(SHIP_BLINK_DUR * FPS);
                ship.blinkNum--;
            }
        }
    }

    function drawGame() {
        const exploding = ship.explodeTime > 0;
        const blinkOn = ship.blinkNum % 2 == 0;

        // Disegna Asteroidi
        ctx.strokeStyle = "slategray";
        ctx.lineWidth = SHIP_SIZE / 20;
        for (let i = 0; i < roids.length; i++) {
            // Ottieni proprietà asteroide
            const x = roids[i].x;
            const y = roids[i].y;
            const r = roids[i].r;
            const a = roids[i].a;
            const vert = roids[i].vert;
            const offs = roids[i].offs;

            // Disegna percorso
            ctx.beginPath();
            ctx.moveTo(
                x + r * offs[0] * Math.cos(a),
                y + r * offs[0] * Math.sin(a)
            );

            // Disegna poligono
            for (let j = 1; j < vert; j++) {
                ctx.lineTo(
                    x + r * offs[j] * Math.cos(a + j * Math.PI * 2 / vert),
                    y + r * offs[j] * Math.sin(a + j * Math.PI * 2 / vert)
                );
            }
            ctx.closePath();
            ctx.stroke();
        }

        // Disegna nave
        if (!exploding) {
            if (blinkOn && !ship.dead) {
                drawShip(ship.x, ship.y, ship.a);
            }

            // Gestisci lampeggio invulnerabilità
            if (ship.blinkNum > 0) {
                ship.blinkTime--;
                if (ship.blinkTime == 0) {
                    ship.blinkTime = Math.ceil(SHIP_BLINK_DUR * FPS);
                    ship.blinkNum--;
                }
            }
        } else {
            // Disegna esplosione
            ctx.fillStyle = "darkred";
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, ship.r * 1.7, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, ship.r * 1.4, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.fillStyle = "orange";
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, ship.r * 1.1, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.fillStyle = "yellow";
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, ship.r * 0.8, 0, Math.PI * 2, false);
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(ship.x, ship.y, ship.r * 0.5, 0, Math.PI * 2, false);
            ctx.fill();
        }


        // Disegna laser
        for (let i = 0; i < ship.lasers.length; i++) {
            ctx.fillStyle = "salmon";
            ctx.beginPath();
            ctx.arc(ship.lasers[i].x, ship.lasers[i].y, SHIP_SIZE / 15, 0, Math.PI * 2, false);
            ctx.fill();
        }

        // Disegna testo di gioco (Livello o Game Over)
        if (textAlpha >= 0) {
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "rgba(255, 255, 255, " + textAlpha + ")";
            ctx.font = "small-caps " + TEXT_SIZE + "px 'Courier New', Courier, monospace";
            ctx.fillText(text, w / 2, h * 0.75);
            textAlpha -= (1.0 / TEXT_FADE_TIME / FPS);
        } else if (ship.dead) {
            // Dopo che "Game Over" svanisce, torna all'intro
            gameState = "INTRO";
        }

        // Disegna le vite
        for (let i = 0; i < lives; i++) {
            drawShip(SHIP_SIZE + i * SHIP_SIZE * 1.2, SHIP_SIZE, 0.5 * Math.PI, true);
        }

        // Disegna il punteggio
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "white";
        ctx.font = TEXT_SIZE + "px 'Courier New', Courier, monospace";
        ctx.fillText(score, w - SHIP_SIZE / 2, SHIP_SIZE);

        // Disegna High Score
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.font = (TEXT_SIZE * 0.5) + "px 'Courier New', Courier, monospace";
        ctx.fillText("BEST " + scoreHigh, w / 2, SHIP_SIZE);

        // Controlla high score
        if (score > scoreHigh) {
            scoreHigh = score;
            localStorage.setItem("highscore", scoreHigh);
        }
    }

    function drawShip(x, y, a, asIcon = false) {
        ctx.strokeStyle = "white";
        ctx.lineWidth = SHIP_SIZE / 20;
        ctx.beginPath();
        ctx.moveTo( // Naso della nave
            x + 4 / 3 * ship.r * Math.cos(a),
            y - 4 / 3 * ship.r * Math.sin(a)
        );
        ctx.lineTo( // Retro sinistro
            x - ship.r * (2 / 3 * Math.cos(a) + Math.sin(a)),
            y + ship.r * (2 / 3 * Math.sin(a) - Math.cos(a))
        );
        ctx.lineTo( // Retro destro
            x - ship.r * (2 / 3 * Math.cos(a) - Math.sin(a)),
            y + ship.r * (2 / 3 * Math.sin(a) + Math.cos(a))
        );
        ctx.closePath();
        ctx.stroke();

        // Disegna spinta (se non è un'icona vita e si sta accelerando)
        if (!asIcon && ship.thrusting && !ship.dead) {
             ctx.fillStyle = "red";
             ctx.strokeStyle = "yellow";
             ctx.lineWidth = SHIP_SIZE / 10;
             ctx.beginPath();
             ctx.moveTo( // Retro sinistro
                x - ship.r * (2 / 3 * Math.cos(a) + 0.5 * Math.sin(a)),
                y + ship.r * (2 / 3 * Math.sin(a) - 0.5 * Math.cos(a))
            );
            ctx.lineTo( // Centro dietro la nave
                x - ship.r * 6 / 3 * Math.cos(a),
                y + ship.r * 6 / 3 * Math.sin(a)
            );
            ctx.lineTo( // Retro destro
                x - ship.r * (2 / 3 * Math.cos(a) - 0.5 * Math.sin(a)),
                y + ship.r * (2 / 3 * Math.sin(a) + 0.5 * Math.cos(a))
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
    }

    // Avvia loop iniziale
    ship = newShip(); // Inizializza oggetto nave fittizio per evitare errori prima del primo start
    loop();

</script>
</body>
</html>
